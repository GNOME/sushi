include:
  - project: 'gnome/citemplates'
    file: 'templates/default-rules.yml'
  - project: "gnome/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"
  - component: "gitlab.gnome.org/GNOME/citemplates/gnomeos-basic-ci@master"
    inputs:
      before-script: "npm clean-install --install-links"
      job-stage: "test"
      gobject-linter: "enabled"
      gobject-linter-options: "-c build-aux/gobject-linter.toml"
  - component: "gitlab.gnome.org/GNOME/citemplates/release-service@master"
    inputs:
      job-stage: release
      dist-job-name: "flatpak@x86_64"
      tarball-artifact-path: "${TARBALL_ARTIFACT_PATH}"

variables:
  FLATPAK_MODULE: "sushi"
  TARBALL_ARTIFACT_PATH: ".flatpak-builder/build/${FLATPAK_MODULE}/_flatpak_build/meson-dist/${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.xz"

.flatpak-vars:
  variables:
    MANIFEST_PATH: "flatpak/org.gnome.NautilusPreviewer.json"
    APP_ID: "org.gnome.NautilusPreviewer.Devel"
    RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
    BUNDLE: "sushi-dev.flatpak"

workflow:
  rules:
    # Run merge request pipelines, for main or release branches, for
    # manually triggered pipelines (source "web"), and tags, but not for
    # translation updates
    - if: $CI_COMMIT_TITLE !~ /^Update.*translation$/ &&
          ($CI_PIPELINE_SOURCE == "merge_request_event" ||
           $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED ||
           $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
           $CI_COMMIT_BRANCH =~ /^gnome-.*$/ ||
           $CI_PIPELINE_SOURCE == "web")

stages:
  - image
  - review
  - test
  - deploy
  - release

potfile:
  image: quay.io/gnome_infrastructure/gnome-build-meta:gnomeos-devel-nightly
  stage: review
  script:
    - build-aux/check-potfiles.sh

style check:
  image: quay.io/gnome_infrastructure/gnome-build-meta:gnomeos-devel-nightly
  stage: review
  script:
    - build-aux/format.sh
    - git diff --exit-code | tee style-check.diff

  artifacts:
    name: 'Style check artifacts'
    when: on_failure
    paths:
      - 'style-check.diff'
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH !~ /^gnome-.*$/

flatpak@x86_64:
  extends:
    - ".flatpak@x86_64"
    - ".flatpak-vars"

flatpak@aarch64:
  when: manual
  rules:
    - if: $CI_PROJECT_NAMESPACE == "GNOME" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  extends:
    - ".flatpak@aarch64"
    - ".flatpak-vars"

nightly@x86_64:
  extends: ".publish_nightly"
  needs: ["flatpak@x86_64"]

nightly@aarch64:
  extends: ".publish_nightly"
  needs: ["flatpak@aarch64"]
